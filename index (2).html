<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HexPerator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f4f4f9;
        }
        textarea {
            width: 100%;
            height: 120px;
            margin-bottom: 15px;
            padding: 10px;
            box-sizing: border-box;
            font-family: monospace;
        }
        button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <h2>HexPerator</h2>
    <p>Paste your hexadecimal without spaces:</p>

    <textarea id="inputText" placeholder="Example: 4D54686400000006..."></textarea>

    <button onclick="formatHex()">Seperate with spaces</button>

    <h3>Result:</h3>
    <textarea id="outputText" readonly placeholder="The result will be shown here..."></textarea>
    <button onclick="copyOutput()">Copy Output</button>

    <script>
        function formatHex() {
            let input = document.getElementById("inputText").value;
            let cleanInput = input.replace(/\s+/g, '');
            let hexPairs = cleanInput.match(/.{1,2}/g);
            if (hexPairs) {
                document.getElementById("outputText").value = hexPairs.join(' ');
            } else {
                document.getElementById("outputText").value = "";
            }
        }
       function copyOutput() {
           const output = document.getElementById("outputText").value;
           if (!output) {
             alert("Nothing to copy!");
           return;
        }
          const tempTextarea = document.createElement('textarea');
          tempTextarea.value = output;
          document.body.appendChild(tempTextarea);
          tempTextarea.select();
          tempTextarea.setSelectionRange(0, 99999); // for mobile
          try {
          const successful = document.execCommand('copy');
          if (successful) {
             alert('Copied to clipboard!');
          } else {
             alert('Failed to copy!');
          }
          } catch (err) {
             alert('Failed to copy!');
          }
          document.body.removeChild(tempTextarea);
          }
    </script>

</body>
</html>
